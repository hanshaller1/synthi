i gekoppelte Saiten."}),l.jsx("p",{children:"Rechtsklick startet MIDI Learn. Neue Parameter sind in Presets, Projekten, Undo/Redo, Locks, Matrix und WAV integriert. Mit „Anschlag“ markierte Ziele greifen ab der nächsten Note. Alte Sounds behalten ihren Legacy-Pfad; neue Klangfunktionen benötigen AudioWorklet. Sieben zusätzliche Expansion-Sounds stehen im Soundbrowser."})]}),l.jsxs("section",{children:[l.jsx("h3",{children:"Make it yours"}),l.jsx("p",{children:"Acht Engines: Subtractive, Wavetable, FM, Additive, Ring/AM, Granular, Sampler und Physical. Die Sound Library enthält zusätzlich acht neue Presets je Syntheseform außer Sampler, insgesamt 56 Sounds. Alle bisherigen Presets bleiben verfügbar."}),l.jsxs("p",{children:["Granular und Sampler enthalten eine interne Textur. Eigene 32 Wavetables, 32 Granular-Texturen und 64 Sampler-Sounds sind integriert. Eigene Samples über ",l.jsx("b",{children:"Import sample"})," laden (max. 15 MB / 60 s)."]}),l.jsx("p",{children:"Modulation: 24 Routen mit eigener Linear-/Exp-/Log-Kurve. Drei LFOs bieten Free Run, Note Retrigger, One Shot, Half Cycle und Sample & Hold, Sync von 1/64 bis acht Takten einschließlich Triolen und punktierter Werte, Phase, Delay/Fade, Skew, Slew, Polarität und Pulsbreite. Amp-/Filter-Envelope, zwei Mod-ADSRs, Random, Aftertouch, Pitch Bend und vier Macros ergänzen die Quellen."}),l.jsx("p",{children:"Alle FX-Regler, LFO-Regler sowie Slot-Bypass und Variante stehen in Matrix, Locks und MIDI Learn bereit. „Anschlag“ bedeutet Note-On/Step; Zyklen zwischen Generatoren sind gesperrt. Neue Stimmen-Ziele greifen ab der nächsten Note. Die Knöpfe zeigen Grundwert, möglichen Modulationsbereich und einen Punkt für den wirksamen Wert."}),l.jsx("p",{children:"Vier serielle FX-Slots mit je fünf Varianten: zusätzliche Klangregler, dauerhaftes BPM-Sync für Delay sowie Vibrato/Tremolo, sichere kurze Überblendungen für Varianten und Struktur. Track-FX verwenden die zuletzt gehaltene Note, danach deren Release; Track-LFO
