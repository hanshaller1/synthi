ie separate OP-Auswahl darunter wechselt zwischen drei vollständigen ADSRs mit Attack-/Decay-/Release-Kurven. Kurve 0 ist linear; positive Werte beginnen langsamer, negative schneller. Globale Amp-ADSR und Filter bleiben zusätzlich aktiv."}),l.jsx("p",{children:"Fixed Hz folgt nicht der gespielten Note; globale Transposition, Fine und Pitch Bend wirken weiterhin. Routing, Waveform, Frequenzmodus und Operator-ADSR werden beim nächsten Anschlag übernommen. Randomize variiert alle drei Operatoren, ihre Hüllkurven und die sechs Routings mit moderaten Indizes. Neue FM-Patches starten mit wirksamen OP-3-Verbindungen; importierte Indexwerte bleiben erhalten. Laufende Ratio-/Hz-/Level-/Fine-/Feedback-/Index-Änderungen sind geglättet. Rechtsklick auf Operator-Waveform, Frequenzmodus oder Algorithmusauswahl: MIDI Learn. Der Algorithmus wird in sechs gleich großen MIDI-CC-Bereichen gewählt."}),l.jsx("p",{children:"Alte FM-Presets und Locks werden automatisch migriert. Feedback und Release können durch den neuen Signalweg anders klingen. FM benötigt AudioWorklet über HTTPS/localhost. Maximal 32 FM-Noten beziehungsweise insgesamt 128 Unison-Layer; bei acht Layern sind dies bis zu 16 Noten einschließlich Release-Phasen."})]}),l.jsxs("section",{children:[l.jsx("h3",{children:"Filter & envelope"}),l.jsxs("p",{children:[l.jsx("b",{children:"Base-Width:"})," 6-dB-Hochpass und Tiefpass vor dem Main Filter, für alle acht Engines. Base = untere Grenze, Width = Bandbreite in Oktaven. Base und Width auf Open: neutral, auch bei eingeschaltetem Filter."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Main:"})," Classic behält die bisherige Abstimmung. Butterworth, Ladder, State Variable und Acid bieten neue Resonanzverläufe; Multimode ergänzt 36/48 dB und Morph LP ↔ BP ↔ HP. Ladder/Acid bieten unter Main Character optional 2×-Oversampling gegen Aliasing, mit zusätzlicher CPU-Last und 31 Samples Latenz; 1× bleibt Standard. Peak gain erlaubt Absenkung und Anhebung. Main Character enthält Keytrack, Resonance compensation, Mix und Drive Pre/Post."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Comb:"})," Feedback oder Feedforward, ±-Polarität, Wet gain, Keytrack, Fine und Stereo spread. Feedback HP und Saturation bearbeiten nur den Feedback-Pfad. HD verwendet Lagrange-Interpolation; Legacy bewahrt alte Klänge. Wet gain verstärkt den gesamten Wet-Pfad, auch ohne Feedback; seine Umbenennung ändert keine gespeicherten Werte."]}),l.jsxs("p",{children:[l.jsx("b",{children:"ENV DEPTH:"})," ±6 Oktaven, separate Attack-/Decay-/Release-Kurven. Kurve 0 erhält den bisherigen Verlauf. Velocity → depth skaliert die Tiefe mit dem Anschlag. Keytrack 100 % verschiebt die Frequenz pro zwölf Halbtönen um eine Oktave, Referenz C4."]}),l.jsx("p",{children:"Die normierte Filter-ADSR zeigt 0–100 %, ihre Kurven und proportionalen Zeitverhältnisse, unabhängig von Cutoff, Env depth und Velocity. Auch bei Tiefe 0 oder negativer Tiefe bleibt die Form sichtbar. Die vier ADSR-Regler stehen in einer Reihe. Die Response zeigt Base, Peak und Sustain für die ausgewählte Vorschau-Note und Velocity, einschließlich Base-Width und Filter-Mix. Bei Sättigung ist sie eine Kleinsignalantwort. Ohne laufende Matrix/LFOs. Neue Parameter unterstützen Locks und MIDI Learn; mit „Anschlag“ markierte Matrixziele gelten ab dem nächsten Anschlag."})]}),l.jsxs("section",{children:[l.jsx("h3",{children:"Erweiterte Klangquellen"}),l.jsx("p",{children:"Character / Unison enthält die neuen Einstellungen im gemeinsamen Moduldesign. Subtractive: Hard Sync, zwei Pulsbreiten, Phase, Sub-Wellenform/Oktave und Noise Color. Wavetable: Bend/Fold/Sync/Mirror, Unison-Positionen, Morph Skew, Phase und Blur. Additive: acht Bänder für alle 32 Partials, Spectral Decay, Detune/Drift, Blur und Random Phase."}),l.jsx("p",{children:"Ring/AM: Ratio oder Fixed Hz, Modulatorphase, eigene Pitch- und Depth-ADSR, Sideband Tilt/LP und echter DC-Modulator-Bias. Granular: vier Fensterformen mit Attack/Release, Skalenquantisierung, Tempo Sync, Freeze und Stereo Motion/Drift. Freeze hält die aktuelle Cloud; Änderungen greifen bei neuen Grains innerhalb des 150-ms-Vorlaufs."}),l.jsx("p",{children:"Sampler: One-shot, Gate oder Loop; bis zu 32 gleiche Slices, Velocity → Start, Loop Crossfade und Ping-pong. Time Stretch trennt Dauer von Tonhöhe; Duration wirkt in diesem Modus, starke Dehnungen können körnig klingen. One-shot ignoriert das Loslassen und plant sein Ende aus Slice-Länge und Anschlagstonhöhe. Physical: Pick Hardness, Pickup, Anregungsdauer, Body-Frequenz/Q, Steifigkeit, kontinuierlicher Bogen und drei gekoppelte Saiten."}),l.jsx("p",{children:"Rechtsklick startet MIDI Learn. Neue Parameter sind in Presets, Projekten, Undo/Redo, Locks, Matrix und WAV integriert. Mit „Anschlag“ markierte Ziele greifen ab der nächsten Note. Alte Sounds behalten ihren Legacy-Pfad; neue Klangfunktionen benötigen AudioWorklet. Sieben zusätzliche Expansion-Sounds stehen im Soundbrowser."})]}),l.jsxs("section",{children:[l.jsx("h3",{children:"Make it yours"}),l.jsx("p",{children:"Acht Engines: Subtractive, Wavetable, FM, Additive, Ring/AM, Granular, Sampler und Physical. Die Sound Library enthält zusätzlich acht neue Presets je Syntheseform außer Sampler, insgesamt 56 Sounds. Alle bisherigen Presets bleiben verfügbar."}),l.jsxs("p",{children:["Granular und Sampler enthalten eine interne Textur. Eigene 32 Wavetables, 32 Granular-Texturen und 64 Sampler-Sounds sind integriert. Eigene Samples über ",l.jsx("b",{children:"Import sample"})," laden (max. 15 MB / 60 s)."]}),l.jsx("p",{children:"Modulation: 24 Routen mit eigener Linear-/Exp-/Log-Kurve. Drei LFOs bieten Free Run, Note Retrigger, One Shot, Half Cycle und Sample & Hold, Sync von 1/64 bis acht Takten einschließlich Triolen und punktierter Werte, Phase, Delay/Fade, Skew, Slew, Polarität und Pulsbreite. Amp-/Filter-Envelope, zwei Mod-ADSRs, Random, Aftertouch, Pitch Bend und vier Macros ergänzen die Quellen."}),l.jsx("p",{children:"Alle FX-Regler, LFO-Regler sowie S
