n:"Piano Roll"}),l.jsx("p",{children:"Den Editortyp pro Track im Sequencer wählen. Das Step-Register zeigt Piano-Tracks als schreibgeschützte Notenübersicht; Mute und Solo bleiben bedienbar."}),l.jsxs("p",{children:[l.jsx("b",{children:"Track-Wiedergabe:"})," Play spielt nur diesen Track ab der Startmarkierung, Pause hält die Position, Stop beendet die Wiedergabe. Die Solo-Einstellungen bleiben erhalten; Mute wird berücksichtigt. Der Bereich spielt vorwärts, unabhängig von der Richtung des gemeinsamen Transports."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Bereich:"})," Die beiden Marker oben im Lineal ziehen. Shift+Klick setzt den Anfang, Alt+Klick das Ende. Fokussierte Marker mit Links/Rechts verschieben (Shift: vier Steps); Home/End setzt an die jeweilige Grenze. Loop wiederholt den Bereich; ausgeschaltet endet die Wiedergabe am Endmarker."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Follow:"})," Die Ansicht scrollt während der Wiedergabe automatisch mit dem Abspielkopf."]}),l.jsx("p",{children:"Zeichnen: Note setzen und Länge ziehen. Noten verschieben, an beiden Rändern skalieren, mit Shift mehrfach auswählen. Das Hand-Werkzeug verschiebt den Ausschnitt."}),l.jsx("p",{children:"Velocity unten ziehen; genaue Werte, Chance, Microtiming, Bedingungen und Noten-Locks im Inspector bearbeiten. Ctrl/Cmd+C/V/D kopiert, fügt am Cursor ein und dupliziert; Ctrl/Cmd+Z macht rückgängig. Shift+Pfeile oben/unten transponieren um eine Oktave."}),l.jsxs("p",{children:[l.jsx("b",{children:"Scale:"})," Grundton und Skala wählen; neue und vertikal verschobene Noten rasten in der Skala ein. Fold zeigt verwendete Noten und bei aktiver Skala deren Töne. Bestehende Noten bleiben erhalten."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Zoom:"})," Im Zeitlineal vertikal ziehen zum Zoomen, horizontal zum Verschieben. Ctrl/Cmd + Mausrad zoomt die Zeitachse am Mauszeiger, Alt + Mausrad die Tonhöhenachse. Doppelklick auf das Lineal oder H passt das Pattern ein; +/− zoomt zur Mitte."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Werkzeuge:"})," Melodie, Euclid-Rhythmus und Arpeggio generieren; Zeit/Tonhöhen spiegeln, Legato, Zeit strecken/stauchen, rotieren und quantisieren. Humanize variiert Timing, Velocity und Länge. Bereich wählen, Vorschau erzeugen, übernehmen; jede Anwendung lässt sich mit Undo zurücknehmen."]}),l.jsx("p",{children:"Rechtsklick oder Doppelklick löscht eine Note, Alt + Ziehen kopiert sie. Ctrl/Cmd+A wählt alle Noten, Ctrl/Cmd+X schneidet aus, Ctrl/Cmd+Shift+Z wiederholt. Ränder ziehen ändert die Länge. Alle Änderungen der Notenposition werden vorgehört."}),l.jsx("p",{children:"Step → Piano Roll übernimmt alle Patterns. Piano Roll → Step zeigt vorab mögliche Verluste und verlangt eine Bestätigung. Die ursprünglichen Patterns bleiben wiederherstellbar."})]}),l.jsxs("section",{children:[l.jsx("h3",{children:"FM · drei Operatoren"}),l.jsx("p",{children:"In Oscillator OP 1/2/3 wählen: Waveform, Ratio oder Fixed Hz, Fine, Level und Feedback. Nur die zum Algorithmus passenden Verbindungs-Indizes werden angezeigt. Level und OP-ADSR wirken vor Modulations- und Audioausgängen; jeder Modulationspfeil hat eine eigene Tiefe."}),l.jsx("p",{children:"Character / Unison bietet Serial, Parallel, Branched, Dual Carrier, Hybrid und Triple Carrier samt Schaltbild. Die separate OP-Auswahl darunter wechselt zwischen drei vollständigen ADSRs mit Attack-/Decay-/Release-Kurven. Kurve 0 ist linear; positive Werte beginnen langsamer, negative schneller. Globale Amp-ADSR und Filter bleiben zusätzlich aktiv."}),l.jsx("p",{children:"Fixed Hz folgt nicht der gespielten Note; globale Transposition, Fine und Pitch Bend wirken weiterhin. Routing, Waveform, Frequenzmodus und Operator-ADSR werden beim nächsten Anschlag übernommen. Randomize variiert alle drei Operatoren, ihre Hüllkurven und die sechs Routings mit moderaten Indizes. Neue FM-Patches starten mit wirksamen OP-3-Verbindungen; importierte Indexwerte bleiben erhalten. Laufende Ratio-/Hz-/Level-/Fine-/Feedback-/Index-Änderungen sind geglättet. Rechtsklick auf Operator-Waveform, Frequenzmodus oder Algorithmusauswahl: MIDI Learn. Der Algorithmus wird in sechs gleich großen MIDI-CC-Bereichen gewählt."}),l.jsx("p",{children:"Alte FM-Presets und Locks werden automatisch migriert. Feedback und Release können durch den neuen Signalweg anders klingen. FM benötigt AudioWorklet über HTTPS/localhost. Maximal 32 FM-Noten beziehungsweise insgesamt 128 Unison-Layer; bei acht Layern sind dies bis zu 16 Noten einschließlich Release-Phasen."})]}),l.jsxs("section",{children:[l.jsx("h3",{children:"Filter & envelope"}),l.jsxs("p",{children:[l.jsx("b",{children:"Base-Width:"})," 6-dB-Hochpass und Tiefpass vor dem Main Filter, für alle acht Engines. Base = untere Grenze, Width = Bandbreite in Oktaven. Base und Width auf Open: neutral, auch bei eingeschaltetem Filter."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Main:"})," Classic behält die bisherige Abstimmung. Butterworth, Ladder, State Variable und Acid bieten neue Resonanzverläufe; Multimode ergänzt 36/48 dB und Morph LP ↔ BP ↔ HP. Ladder/Acid bieten unter Main Character optional 2×-Oversampling gegen Aliasing, mit zusätzlicher CPU-Last und 31 Samples Latenz; 1× bleibt Standard. Peak gain erlaubt Absenkung und Anhebung. Main Character enthält Keytrack, Resonance compensation, Mix und Drive Pre/Post."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Comb:"})," Feedback oder Feedforward, ±-Polarität, Wet gain, Keytrack, Fine und Stereo spread. Feedback HP und Saturation bearbeiten nur den Feedback-Pfad. HD verwendet Lagrange-Interpolation; Legacy bewahrt alte Klänge. Wet gain verstärkt den gesamten Wet-Pfad, auch ohne Feedback; seine Umbenennung ändert keine gespeicherten Werte."]}),l.jsxs("p",{children:[l.jsx("b",{children:"ENV DEPTH:"})," ±6 Oktaven, separate Attack-/Decay-/Release-Kurven. Kurve 0 erhält den bisherigen Verlauf. Velocity → depth skaliert die Tiefe mit dem Anschlag. Keytrack 100 % verschiebt die Frequenz pro zwölf Halb en, Undo/Redo, Locks, Matrix und WAV integriert. Mit „Anschlag“ markierte Ziele greifen ab der nächsten Note. Alte Sounds behalten ihren Legacy-Pfad; neue Klangfunktionen benötigen AudioWorklet. Sieben zusätzliche Expansion-Sounds stehen im Soundbrowser."})]}),l.jsxs("section",{children:[l.jsx("h3",{children:"Make it yours"}),l.jsx("p",{children:"Acht Engines: Subtractive, Wavetable, FM, Additive, Ring/AM, Granular, Sampler und Physical. Die Sound Library enthält zusätzlich acht neue Presets je Syntheseform außer Sampler, insgesamt 56 Sounds. Alle bisherigen Presets bleiben verfügbar."}),l.jsxs("p",{children:["Granular und Sampler enthalten eine interne Textur. Eigene 32 Wavetables, 32 Granular-Texturen und 64 Sampler-Sounds sind integriert. Eigene Samples über ",l.jsx("b",{children:"Import sample"})," laden (max. 15 MB / 60 s)."]}),l.jsx("p",{children:"Modulation: 24 Routen mit eigener Linear-/Exp-/Log-Kurve. Drei LFOs bieten Free Run, Note Retrigger, One Shot, Half Cycle und Sample & Hold, Sync von 1/64 bis acht Takten einschließlich Triolen und punktierter Werte, Phase, Delay/Fade, Skew, Slew, Polarität und Pulsbreite. Amp-/Filter-Envelope, zwei Mod-ADSRs, Random, Aftertouch, Pitch Bend und vier Macros ergänzen die Quellen."}),l.jsx("p",{children:"Alle FX-Regler, LFO-Regler sowie Slot-Bypass und Variante stehen in Matrix, Locks und MIDI Learn bereit. „Anschlag“ bedeutet Note-On/Step; Zyklen zwischen Generatoren sind gesperrt. Neue Stimmen-Ziele greifen ab der nächsten Note. Die Knöpfe zeigen Grundwert, möglichen Modulationsbereich und einen Punkt für den wirksamen Wert."}),l.jsx("p",{children:"Vier serielle FX-Slots mit je fünf Varianten: zusätzliche Klangregler, dauerhaftes BPM-Sync für Delay sowie Vibrato/Tremolo, sichere kurze Überblendungen für Varianten und Struktur. Track-FX verwenden die zuletzt gehaltene Note, danach deren Release; Track-LFOs laufen während der Effekt-Tails weiter. Gemeinsame FX-Locks folgen der Ereignisreihenfolge. Master FX bleiben sepa
